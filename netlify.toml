[build]
  publish = "public"
  command = "hugo --gc --minify"
  ignore = "bash scripts/netlify-ignore-airef.sh"

[context.production.environment]
  HUGO_VERSION = "0.62.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  
[context.branch-deploy.environment]
  HUGO_VERSION = "0.62.1"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.62.1"
  
[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL --buildFuture --gc --minify"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL --buildFuture --gc --minify"
  
