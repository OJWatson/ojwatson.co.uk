name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: hugo build + link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content-check dependencies
        run: python3 -m pip install -r requirements-checks.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.62.1'
          extended: true

      - name: Hugo version
        run: hugo version

      - name: Run regression checks
        run: bash scripts/regression.sh
