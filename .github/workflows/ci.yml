name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: hugo build + link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version

      - name: Run regression checks
        run: bash scripts/regression.sh
