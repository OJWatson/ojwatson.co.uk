name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: hugo build + link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.62.1'
          extended: true

      - name: Run regression checks
        run: bash scripts/regression.sh
