name: AIRef

on:
  push:
    branches: [main]
    paths:
      - 'apps/airef/**'
      - '.github/workflows/airef.yml'
  pull_request:
    paths:
      - 'apps/airef/**'
      - '.github/workflows/airef.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airef-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: AIRef checks and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/airef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/airef/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy and verify preview before production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'OJWatson/ojwatson.co.uk'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.AIREF_CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run deploy:ci -- preview
          npm run smoke:ci -- preview
          npm run deploy:ci -- production
          npm run smoke:ci -- production
