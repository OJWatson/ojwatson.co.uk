{{ define "main" }}
<main id="main-content" class="projects-page">
<header class="page-intro container"><p class="eyebrow">Open research</p><h1>Software & research code</h1><div class="intro-copy">{{ .Content }}</div><div class="link-row"><a class="text-link" href="{{ "/outputs/" | relURL }}">Selected publications <span aria-hidden="true">↗</span></a><a class="text-link" href="https://github.com/OJWatson">OJ on GitHub <span aria-hidden="true">↗</span></a></div></header>
<section class="container software-grid" aria-label="Research software">{{ range sort (where site.RegularPages "Section" "project") "Title" }}<article class="software-item"><p class="eyebrow">{{ .Params.project_type }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Params.summary }}</p><a class="text-link" href="{{ .RelPermalink }}">About the project <span aria-hidden="true">↗</span></a></article>{{ end }}</section>
</main>{{ end }}
