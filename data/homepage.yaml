eyebrow: "Imperial College London · Infectious disease modelling"
headline: "Models for epidemics."
headline_accent: "Evidence for decisions."
intro: "We study malaria resistance, vaccine impact and disease burden in crisis-affected settings, combining mathematical models, statistical inference and machine learning."
about: "Led by OJ Watson at Imperial College London, our research brings together epidemiology, data and open software to help answer public health questions."
