eyebrow: Imperial College London
headline: Infectious disease modelling
intro: I’m OJ Watson, an Associate Professor at Imperial College London. I work on malaria, vaccination
  and mortality estimation with a small group of students and collaborators.
about: I work with doctoral students, research staff and collaborators, with interests in epidemiology,
  public health and research software.
